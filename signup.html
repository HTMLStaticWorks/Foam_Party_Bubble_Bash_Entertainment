<!DOCTYPE html>
<html lang="en" data-theme="dark" data-dir="ltr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Your Account — FoamFest</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        var t = localStorage.getItem("foamfest-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
        var d = localStorage.getItem("foamfest-dir");
        if (d === "rtl") {
          document.documentElement.setAttribute("data-dir", "rtl");
          document.documentElement.setAttribute("dir", "rtl");
        }
      })();
    </script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="auth-toggles" aria-label="Page preferences">
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle dark and light mode">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="4" /></svg>
      </button>
      <button type="button" class="icon-btn" data-dir-toggle aria-label="Toggle text direction">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M8 6h12M8 12h8M8 18h12" /></svg>
      </button>
    </div>

    <div class="auth-page">
      <div class="auth-bg" aria-hidden="true">
        <img src="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?w=3840&q=100&fit=crop&auto=format" alt="" width="1920" height="1080" style="width:100%;height:100%;object-fit:cover" fetchpriority="high" />
      </div>
      <div class="auth-card">
        <a href="index.html" class="logo-link auth-logo" style="display: flex; width: 100%; justify-content: center">
          <svg class="logo-icon" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="14" cy="20" r="10" stroke="currentColor" stroke-width="2" fill="none" />
            <circle cx="26" cy="14" r="7" stroke="currentColor" stroke-width="2" fill="none" />
            <circle cx="28" cy="28" r="5" stroke="currentColor" stroke-width="2" fill="none" />
          </svg>
          <span class="logo-wordmark">FoamFest</span>
        </a>
        <h1 class="text-center" style="font-size: 1.75rem; margin-bottom: var(--space-xl)">Create Your Account</h1>
        <form class="form-stack" action="#" method="post" autocomplete="on">
          <div>
            <label for="su-fn">First Name</label>
            <input class="input" id="su-fn" name="first_name" type="text" autocomplete="given-name" required />
          </div>
          <div>
            <label for="su-ln">Last Name</label>
            <input class="input" id="su-ln" name="last_name" type="text" autocomplete="family-name" required />
          </div>
          <div>
            <label for="su-email">Email Address</label>
            <input class="input" id="su-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="password-field">
            <label for="su-pass">Password</label>
            <input class="input" id="su-pass" name="password" type="password" autocomplete="new-password" required />
            <button type="button" class="toggle-eye" aria-label="Show or hide password">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" /><circle cx="12" cy="12" r="3" /></svg>
            </button>
          </div>
          <div class="password-field">
            <label for="su-pass2">Confirm Password</label>
            <input class="input" id="su-pass2" name="password_confirm" type="password" autocomplete="new-password" required />
            <button type="button" class="toggle-eye" aria-label="Show or hide confirm password">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" /><circle cx="12" cy="12" r="3" /></svg>
            </button>
          </div>
          <button type="submit" class="btn btn--primary btn--full">Create Account</button>
        </form>
        <div class="auth-divider">or sign up with</div>
        <button type="button" class="social-auth-btn" aria-label="Sign up with Google">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continue with Google
        </button>
        <button type="button" class="social-auth-btn" aria-label="Sign up with Apple">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.975 1.87-.326-.914-.93-1.65-1.77-2.22C10.52 2.55 9.64 2.17 8.7 2.2c-.195 1.04.29 2.04.92 2.83-.78.35-1.63.64-2.33 1.28-.89.83-1.48 2.14-1.48 3.44 0 2.45 1.78 4.58 4.22 4.58 1.04 0 1.95-.42 2.67-1.07.67.11 1.36.18 2.05.18 1.04 0 2.02-.15 2.95-.44.67.66 1.52 1.05 2.44 1.05 2.28 0 4.14-1.95 4.14-4.35 0-1.39-.72-2.58-1.82-3.35.46-1.15.69-2.37.69-3.59 0-2.27-1.04-4.27-2.68-5.57-.67-.56-1.47-.97-2.34-1.23-.29-.08-.59-.14-.9-.18zM13.18 8.66c.58 0 1.11.15 1.58.42-.42.35-.77.78-1.05 1.26-.35-.22-.76-.35-1.2-.35-.77 0-1.45.35-1.89.9-.45-.55-1.04-.95-1.72-1.14.29-.65.92-1.09 1.66-1.09h1.62z" /></svg>
          Continue with Apple
        </button>
        <button type="button" class="social-auth-btn" aria-label="Sign up with Facebook">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" /></svg>
          Continue with Facebook
        </button>
        <p class="auth-footer-text">Already have an account? <a href="login.html">Log In</a></p>
      </div>
    </div>
  </body>
</html>
